<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мій CRM</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Onest:wght@400;500;600&display=swap&subset=cyrillic" rel="stylesheet">
<script>
  // Тема визначається до малювання сторінки, щоб не було блимання
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('crm-theme'); } catch (e) {}
    var dark = saved ? saved === 'dark' : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
<style>
  :root {
    --bg: #F2EDE4;
    --surface: #FAF7F1;
    --surface-2: #E9E3D7;
    --ink: #2A2E29;
    --muted: #686E65;
    --line: #D9D2C4;
    --green: #587562;
    --green-deep: #3E5646;
    --green-soft: #DCE5DB;
    --on-green: #FFFFFF;
    --lilac: #8E7BA6;
    --lilac-soft: #E6E0EE;
    --danger: #D4162E;
    --danger-soft: #FBE3E5;
    --warn: #8A6A1E;
    --warn-soft: #F3E8CC;
    --shadow: 0 1px 2px rgba(42, 46, 41, .06);
    --serif: "Cormorant Garamond", "Georgia", "Times New Roman", serif;
    --sans: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  :root[data-theme="dark"] {
    --bg: #1B201C;
    --surface: #242A25;
    --surface-2: #2D342E;
    --ink: #E9E6DE;
    --muted: #A2A99F;
    --line: #38403A;
    --green: #8FAF95;
    --green-deep: #A9C6AE;
    --green-soft: #2B3A2F;
    --on-green: #15201A;
    --lilac: #B7A6CE;
    --lilac-soft: #342F3F;
    --danger: #FF6B6B;
    --danger-soft: #3E2528;
    --warn: #E3C16F;
    --warn-soft: #3A3220;
    --shadow: none;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--green); outline-offset: 2px; border-radius: 6px; }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- шапка ---------- */
  .topbar {
    max-width: 1120px; margin: 0 auto; padding: 20px 24px 0;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { font-family: var(--serif); font-size: 1.5rem; font-weight: 600; color: var(--green-deep); letter-spacing: .01em; }
  .tools { display: flex; gap: 4px; align-items: center; }
  .icon-btn {
    min-width: 44px; min-height: 44px; border: 0; background: transparent; border-radius: 12px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; color: var(--muted); padding: 0 12px;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
  .icon-btn svg { width: 20px; height: 20px; flex: none; }

  /* ---------- сторінка ---------- */
  .page { max-width: 1120px; margin: 0 auto; padding: 28px 24px 64px; }
  .grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 56px; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); gap: 40px; } .page { padding: 20px 16px 56px; } .topbar { padding: 12px 16px 0; } }

  h1, h2 { margin: 0; font-family: var(--serif); font-weight: 600; letter-spacing: .005em; }
  h1 { font-size: clamp(2.4rem, 5vw, 3.4rem); line-height: 1.05; color: var(--ink); }
  h2 { font-size: 1.7rem; line-height: 1.15; }
  .date-line { color: var(--muted); margin: 6px 0 0; font-size: 1.02rem; }
  .section { margin-bottom: 44px; }
  .section:last-child { margin-bottom: 0; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .count { color: var(--muted); font-size: .95rem; }

  /* ---------- сьогодні ---------- */
  .today-head { margin-bottom: 28px; }
  .timeline { list-style: none; margin: 0; padding: 0; position: relative; }
  .timeline::before { content: ""; position: absolute; left: calc(4.1rem + 17px); top: 14px; bottom: 14px; width: 2px; background: var(--line); }
  .slot { display: grid; grid-template-columns: 4.1rem 1.6rem minmax(0, 1fr); align-items: start; padding: 10px 0; position: relative; }
  .slot-time { font-family: var(--serif); font-size: 2rem; font-weight: 600; line-height: 1.1; text-align: right; padding-top: 6px; font-variant-numeric: lining-nums tabular-nums; }
  .slot-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--bg); border: 2px solid var(--green); margin: 14px 0 0 11px; position: relative; z-index: 1; }
  .slot.next .slot-dot { background: var(--green); box-shadow: 0 0 0 5px var(--green-soft); }
  .slot.done .slot-dot { background: var(--green); opacity: .45; }
  .slot.void .slot-dot { border-color: var(--muted); }
  .slot.lost .slot-dot { border-color: var(--warn); background: var(--warn-soft); }
  .slot.void .slot-time { text-decoration: line-through; color: var(--muted); }
  .slot-body { padding: 8px 14px 10px 6px; border-radius: 14px; min-width: 0; }
  .slot.next .slot-body { background: var(--green-soft); }
  .slot-title { font-weight: 600; font-size: 1.12rem; overflow-wrap: anywhere; }
  .slot-meta { color: var(--muted); font-size: .94rem; display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 2px; align-items: center; }
  .tag { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: .86rem; font-weight: 500; }
  .tag svg { width: 14px; height: 14px; }
  .tag.consult { background: var(--lilac-soft); color: var(--lilac); }
  .tag.ok { background: var(--green-soft); color: var(--green-deep); }
  .tag.lost { background: var(--warn-soft); color: var(--warn); }
  .tag.muted { background: var(--surface-2); color: var(--muted); }
  .slot-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .empty { padding: 22px 0 6px; }
  .empty p { margin: 0; }
  .empty .sub { color: var(--muted); margin-top: 4px; }

  /* ---------- кнопки ---------- */
  .btn {
    min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid transparent; font-weight: 500;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
  }
  .btn svg { width: 18px; height: 18px; }
  .btn.primary { background: var(--green); color: var(--on-green); }
  .btn.primary:hover { background: var(--green-deep); }
  .btn.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
  .btn.ghost:hover { background: var(--surface-2); }
  .btn.danger { background: var(--danger); color: #fff; }
  :root[data-theme="dark"] .btn.danger { color: #1B1111; }
  .btn.small { min-height: 38px; padding: 0 14px; font-size: .94rem; border-radius: 10px; }
  .btn.link { background: transparent; border: 0; color: var(--green-deep); padding: 0 6px; text-decoration: underline; text-underline-offset: 3px; }
  .btn[disabled] { opacity: .55; cursor: progress; }

  /* ---------- списки справа ---------- */
  .list { list-style: none; margin: 0; padding: 0; }
  .item { padding: 12px 0; display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; border-top: 1px solid var(--line); }
  .item:first-child { border-top: 0; padding-top: 4px; }
  .item-main { min-width: 0; flex: 1; overflow-wrap: anywhere; }
  .item-sub { color: var(--muted); font-size: .92rem; margin-top: 1px; }
  .item-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .danger-text { color: var(--danger); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .danger-text svg { width: 16px; height: 16px; flex: none; }
  .debt-box { background: var(--danger-soft); border-radius: 14px; padding: 10px 16px; margin-bottom: 14px; }
  .debt-box .item { border-top-color: transparent; padding: 8px 0; }
  .sub-title { font-weight: 600; margin: 0 0 6px; color: var(--muted); font-size: .95rem; }
  .add-task { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; margin-top: 14px; }
  .add-task input[type="text"] { grid-column: 1 / -1; }
  input[type="text"], input[type="email"], input[type="datetime-local"], input[type="date"], input[type="time"], select, textarea {
    min-height: 44px; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); width: 100%;
  }
  textarea { min-height: 110px; resize: vertical; }
  .add-task input[type="date"] { width: 100%; min-width: 0; }
  .check { width: 22px; height: 22px; accent-color: var(--green); margin-top: 2px; flex: none; }


  /* ---------- навігація та розділи ---------- */
  .topbar { flex-wrap: wrap; }
  .nav { display: flex; gap: 4px; margin-left: 16px; flex: 1; }
  .nav a { min-height: 44px; padding: 0 16px; border-radius: 12px; color: var(--muted); text-decoration: none; font-weight: 500; display: inline-flex; align-items: center; }
  .nav a:hover { background: var(--surface-2); color: var(--ink); }
  .nav a[aria-current="page"] { background: var(--green-soft); color: var(--green-deep); }
  @media (max-width: 860px) { .nav { order: 3; flex-basis: 100%; margin: 0 -8px; overflow-x: auto; } }
  .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  .page-head .tag { margin-top: 8px; }
  .head-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .crumb { margin: 0 0 12px; }
  .crumb a, .pay-who, .info a { color: var(--green-deep); text-underline-offset: 3px; }
  .toolbar { display: grid; gap: 12px; margin-bottom: 18px; }
  @media (min-width: 700px) { .toolbar { grid-template-columns: auto minmax(220px, 320px); justify-content: space-between; align-items: center; } }
  .seg { display: inline-flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 14px; flex-wrap: wrap; }
  .seg-btn { min-height: 40px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-weight: 500; }
  .seg-btn:hover { color: var(--ink); }
  .seg-btn[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .person { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px 8px; text-decoration: none; color: inherit; border-top: 1px solid var(--line); min-height: 64px; }
  .people li:first-child .person { border-top: 0; }
  .person:hover { background: var(--surface-2); }
  .person-main { display: flex; flex-direction: column; min-width: 0; }
  .person-name { font-weight: 600; font-size: 1.08rem; overflow-wrap: anywhere; }
  .bal { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; text-align: right; }
  .empty-row { padding: 18px 8px; }
  .info { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 20px; margin: 0; }
  .info dt { color: var(--muted); }
  .info dd { margin: 0; overflow-wrap: anywhere; }
  .links { display: inline-flex; gap: 6px 16px; flex-wrap: wrap; }
  .prewrap { white-space: pre-wrap; }
  .big-bal { font-family: var(--serif); font-size: 2rem; font-weight: 600; line-height: 1.2; }
  .card-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); }
  @media (max-width: 860px) { .card-grid { grid-template-columns: minmax(0, 1fr); } }
  .pay-title { font-weight: 600; }
  .pay-who { margin-left: 12px; font-weight: 400; }
  .pay-side { text-align: right; flex: none; }
  .pay-sum { font-family: var(--serif); font-size: 1.45rem; font-weight: 600; line-height: 1.2; font-variant-numeric: lining-nums; }
  .pay-side .item-actions { justify-content: flex-end; }
  .month-nav { display: flex; align-items: center; gap: 4px; margin-bottom: 18px; }
  .month-nav .icon-btn { font-size: 1.6rem; line-height: 1; }
  .month-label { min-width: 11rem; text-align: center; font-weight: 600; }
  .month-total { display: flex; gap: 10px; align-items: baseline; margin: 0 0 8px; flex-wrap: wrap; }
  .big-num { font-family: var(--serif); font-size: 2.1rem; font-weight: 600; font-variant-numeric: lining-nums; }
  .month-total .lbl { color: var(--muted); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .form-grid { grid-template-columns: 1fr; } }
  .label-like { font-weight: 500; margin-bottom: 6px; }
  .hint { color: var(--muted); font-size: .9rem; margin-top: 4px; }
  .sched-row { display: grid; grid-template-columns: minmax(0, 1fr) 120px auto; gap: 8px; margin-bottom: 8px; }
  .fixed-value { font-weight: 600; padding: 4px 0; }
  .modal.wide { max-width: 600px; }
  .field { margin-bottom: 0; }

  .page.narrow { max-width: 760px; }
  .stats-row { display: flex; gap: 8px 36px; flex-wrap: wrap; margin: 0 0 14px; }
  .stat .big-num { display: block; font-size: 1.8rem; line-height: 1.2; }
  .stat .lbl { color: var(--muted); }
  .space-top { margin-top: 16px; }

  /* ---------- статистика ---------- */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 24px 32px; margin: 8px 0 40px; }
  .kpi .lbl { color: var(--muted); }
  .kpi .big-num { display: block; font-size: 2.3rem; line-height: 1.15; }
  .kpi .item-sub { margin-top: 2px; }
  .msg.warn { background: var(--warn-soft); color: var(--warn); margin: 0 0 20px; }
  .msg.warn a { color: inherit; font-weight: 600; }
  .chart { margin: 0 0 44px; }
  .chart-title { font-family: var(--serif); font-size: 1.7rem; font-weight: 600; margin-bottom: 8px; }
  .chart-scroll { overflow-x: auto; padding-bottom: 6px; }
  .chart svg { display: block; max-width: none; }
  .chart-axis { stroke: var(--line); stroke-width: 2; }
  .chart-bar { fill: var(--green); opacity: .5; }
  .chart-bar.sel { opacity: 1; fill: var(--green-deep); }
  .chart-bar.ongoing { opacity: .35; }
  .chart-bar.ongoing.sel { opacity: .7; }
  .chart-val { fill: var(--muted); font-size: 12px; font-family: var(--sans); }
  .chart-val.sel, .chart-lbl.sel { fill: var(--ink); font-weight: 600; }
  .chart-lbl { fill: var(--muted); font-size: 12px; font-family: var(--sans); }
  .chart-note { fill: var(--muted); font-size: 10px; font-family: var(--sans); }
  .bridge { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 24px; margin: 0; max-width: 520px; }
  .bridge dt { color: var(--muted); }
  .bridge dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .bridge .total { color: var(--ink); font-weight: 700; padding-top: 8px; border-top: 1px solid var(--line); }
  .cmp-row { display: grid; grid-template-columns: minmax(130px, 1.1fr) minmax(90px, 1fr) minmax(110px, 1fr) minmax(130px, 1fr); gap: 4px 16px; align-items: baseline; padding: 12px 0; border-top: 1px solid var(--line); }
  .cmp-row:first-child { border-top: 0; }
  .cmp-name { font-weight: 600; }
  .cmp-cur { font-family: var(--serif); font-size: 1.35rem; font-weight: 600; }
  .delta { font-weight: 600; }
  .delta.up { color: var(--green-deep); }
  .delta.down { color: var(--danger); }
  .delta.none { color: var(--muted); font-weight: 400; }
  @media (max-width: 640px) { .cmp-row { grid-template-columns: 1fr 1fr; } .cmp-name { grid-column: 1 / -1; } }

  /* ---------- рекап року ---------- */
  .recap { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding: 16px 20px calc(20px + env(safe-area-inset-bottom)); background: var(--bg); color: var(--ink); }
  .recap.tone-1 { background: var(--green-soft); }
  .recap.tone-2 { background: var(--lilac-soft); }
  .recap.tone-3 { background: var(--surface-2); }
  .recap-top { display: flex; align-items: center; gap: 16px; max-width: 560px; width: 100%; margin: 0 auto; }
  .recap-progress { flex: 1; display: flex; gap: 6px; }
  .recap-seg { flex: 1; height: 18px; padding: 6px 0; border: 0; background: var(--line); background-clip: content-box; border-radius: 4px; }
  .recap-seg.on { background-color: var(--green-deep); }
  .recap-stage { flex: 1; display: flex; flex-direction: column; justify-content: center; width: 100%; max-width: 560px; margin: 0 auto; padding: 28px 0; }
  .recap-lead { font-size: 1.3rem; margin: 0 0 6px; color: var(--ink); }
  .recap-big { font-family: var(--serif); font-size: clamp(4.4rem, 20vw, 8.5rem); line-height: 1; font-weight: 600; color: var(--green-deep); overflow-wrap: anywhere; font-variant-numeric: lining-nums; }
  .recap-big.text { font-size: clamp(3rem, 14vw, 5.6rem); line-height: 1.05; }
  .recap-unit { font-family: var(--serif); font-size: 2rem; font-weight: 600; margin: 8px 0 0; }
  .recap-line { font-size: 1.12rem; margin: 10px 0 0; color: var(--ink); }
  .recap-figs { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 18px; margin: 10px 0 18px; }
  .recap-fig-val { font-family: var(--serif); font-size: clamp(2rem, 9vw, 3rem); font-weight: 600; line-height: 1.1; color: var(--green-deep); font-variant-numeric: lining-nums; }
  .recap-fig-lbl { color: var(--muted); }
  .recap-fig-delta { font-size: .92rem; font-weight: 600; margin-top: 2px; }
  .recap-controls { display: flex; justify-content: space-between; gap: 12px; max-width: 560px; width: 100%; margin: 0 auto; }
  .recap-controls .btn { flex: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .recap { transition: background-color .4s ease; }
    .recap-stage.enter { animation: recapIn .35s ease both; }
    @keyframes recapIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  }
  .day { margin-bottom: 30px; }
  .day-title { font-size: 1.45rem; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .day.today .day-title { color: var(--green-deep); }
  .day > .item-sub { margin: 4px 0 0; }
  .month-nav .btn { margin-left: 12px; }

  /* ---------- підсумок місяця ---------- */
  .summary { margin-top: 56px; padding: 16px 20px; background: var(--surface-2); border-radius: 16px; display: flex; flex-wrap: wrap; gap: 6px 28px; align-items: baseline; }
  .summary .big { font-family: var(--serif); font-size: 1.8rem; font-weight: 600; font-variant-numeric: lining-nums; }
  .summary .lbl { color: var(--muted); margin-left: 6px; }

  /* ---------- вхід та екрани-повідомлення ---------- */
  .center { max-width: 460px; margin: 12vh auto 0; padding: 0 20px; }
  .center h1 { font-size: 2.6rem; margin-bottom: 8px; }
  .center p { color: var(--muted); margin: 0 0 22px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-weight: 500; margin-bottom: 6px; }
  .msg { margin-top: 16px; padding: 12px 14px; border-radius: 12px; background: var(--green-soft); color: var(--green-deep); }
  .msg.err { background: var(--danger-soft); color: var(--danger); }
  .skeleton { color: var(--muted); padding: 40px 0; }

  /* ---------- вікно та повідомлення ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(20, 24, 21, .5); display: flex; align-items: flex-end; justify-content: center; padding: 16px; z-index: 50; }
  @media (min-width: 600px) { .overlay { align-items: center; } }
  .modal { background: var(--surface); border-radius: 20px; width: 100%; max-width: 480px; max-height: 90vh; overflow: auto; padding: 24px; box-shadow: var(--shadow); }
  .modal h2 { font-size: 1.6rem; margin-bottom: 4px; }
  .modal .who { color: var(--muted); margin: 0 0 16px; }
  .note { padding: 12px 14px; border-radius: 12px; margin: 0 0 16px; background: var(--green-soft); color: var(--green-deep); }
  .note.late { background: var(--warn-soft); color: var(--warn); }
  .note.bad { background: var(--danger-soft); color: var(--danger); }
  .stack { display: grid; gap: 10px; }
  .toasts { position: fixed; left: 0; right: 0; bottom: 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 60; pointer-events: none; padding: 0 12px; }
  .toast { pointer-events: auto; background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 14px; display: flex; gap: 14px; align-items: center; max-width: 520px; }
  .toast .btn.link { color: var(--bg); min-height: 32px; }
  .toast.err { background: var(--danger); color: #fff; }

  @media (prefers-reduced-motion: no-preference) {
    .btn, .icon-btn { transition: background-color .15s ease; }
  }
</style>
</head>
<body>
<div id="app" aria-live="polite"><p class="skeleton center">Завантаження…</p></div>
<div class="toasts" id="toasts" aria-live="assertive"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

  var CONFIG = {

  var TZ = 'Europe/Kyiv';

  // ================= Допоміжне: час (завжди київський) =================
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var dtf = new Intl.DateTimeFormat('en-GB', {

  function plural(n, one, few, many) {

  }
  function money(n) {
    return new Intl.NumberFormat('uk-UA', { maximumFractionDigits: 0 }).format(Math.round(Number(n) || 0)) + ' грн';
  }
  // скільки днів до наступного дня народження (0 = сьогодні)
  function daysToBirthday(birthday, todayStr) {
    var b = birthday.split('-').map(Number), t = todayStr.split('-').map(Number);
    function cand(year) {
      var d = b[2];
      if (b[1] === 2 && d === 29) {
        var leap = (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;

  }

  // ================= Побудова завдань «Не забути» =================
  function buildTasks(s) {
    var out = [];
    var name = function (id) { return (s.studentMap[id] && s.studentMap[id].name) || 'учень'; };
    var today = s.todayStr;

    // 1. Заняття минуло, а статус досі «заплановано»
    s.openPlanned.forEach(function (l) {
      var who = l.kind === 'consultation' ? l.guest_name : name(l.student_id);
      out.push({
        key: 'mark-' + l.id, type: 'mark', lesson: l,
        text: (l.kind === 'consultation' ? 'Відміть консультацію з ' : 'Відміть заняття з ') + who,
        sub: shortDate.format(new Date(l.starts_at)) + ', ' + fmtTime(new Date(l.starts_at).getTime())
      });
    });
    // 2-3. Домашка
    s.hwLessons.forEach(function (l) {
      if (!l.homework_sent) {
        out.push({ key: 'hw-send-' + l.id, type: 'hw-send', lesson: l, text: 'Надішли домашку ' + name(l.student_id), sub: 'Заняття ' + fmtDayMonth(kyivDateStr(new Date(l.starts_at).getTime())) });
      } else if (!l.homework_checked) {
        out.push({ key: 'hw-check-' + l.id, type: 'hw-check', lesson: l, text: 'Перевір домашку ' + name(l.student_id), sub: 'Заняття ' + fmtDayMonth(kyivDateStr(new Date(l.starts_at).getTime())) });
      }
    });
    // 4. Нагадати про оплату
    var thr = s.settings.soon_pay_threshold;
    s.balances.forEach(function (b) {
      var st = s.studentMap[b.student_id];
      if (!st || st.status !== 'active') return;
      if (!(b.lessons_bought > 0 || b.lessons_used > 0)) return;
      if (b.balance <= thr) {
        out.push({ key: 'pay-' + b.student_id, type: 'pay', text: 'Нагадай про оплату ' + st.name, sub: balanceText(b.balance), danger: b.balance < 0 });
      }
    });
    // 5. Податки
    s.deadlines.forEach(function (d) {
      var left = daysBetween(today, d.due_date);
      if (left >= 0 && left <= s.settings.tax_remind_days) {
        out.push({
          key: 'tax-' + d.id, type: 'tax',
          text: (d.kind === 'declaration' ? 'Подати декларацію до ' : 'Сплатити податки до ') + fmtDayMonth(d.due_date),

    (s.pendingExpenses || []).forEach(function (e) {

    });

    var sp = s.summaryProgress;

    // 6б. Резервна копія раз на тиждень
    var lastBackup = s.settings.last_backup_at ? new Date(s.settings.last_backup_at).getTime() : 0;
    if (!lastBackup || Date.now() - lastBackup >= 7 * 86400000) {
      out.push({ key: 'backup', type: 'backup', text: 'Збережи резервну копію', sub: lastBackup ? 'Остання: ' + fmtDMY(kyivDateStr(lastBackup)) : 'Копій ще не було' });
    }
    // 7. Ручні завдання
    s.manualTasks.forEach(function (m) {
      var overdue = m.due_date && m.due_date < today;
      out.push({
        key: 'task-' + m.id, type: 'manual', task: m, text: m.text,
        sub: [m.due_date ? (overdue ? 'Прострочено, ' : 'До ') + fmtDayMonth(m.due_date) : null, m.student_id ? name(m.student_id) : null].filter(Boolean).join(', '),
        danger: !!overdue
      });
    });
    return out;
  }

  function buildPayments(s) {
    var thr = s.settings.soon_pay_threshold, debt = [], now = [], soon = [];
    s.balances.forEach(function (b) {
      var st = s.studentMap[b.student_id];
      if (!st || st.status !== 'active') return;
      if (!(b.lessons_bought > 0 || b.lessons_used > 0)) return;
      if (b.balance < 0) debt.push(b); else if (b.balance === 0) now.push(b); else if (b.balance <= thr) soon.push(b);
    });
    var byBal = function (a, b) { return a.balance - b.balance; };
    return { debt: debt.sort(byBal), now: now, soon: soon.sort(byBal) };
  }

  function buildBirthdays(s) {
    return s.students
      .filter(function (x) { return x.birthday && x.status !== 'ended'; })
      .map(function (x) { return { student: x, days: daysToBirthday(x.birthday, s.todayStr) }; })
      .filter(function (x) { return x.days <= 7; })
      .sort(function (a, b) { return a.days - b.days; });
  }

  // для перевірок у тестах
  window.CRM_LOGIC = { kyivWallToUtc: kyivWallToUtc, kyivDateStr: kyivDateStr, dayRange: dayRange, daysToBirthday: daysToBirthday, balanceText: balanceText, plural: plural, kyivWallString: kyivWallString, parseWallString: parseWallString, buildTasks: buildTasks, buildPayments: buildPayments, fmtTime: fmtTime, statsModel: statsModel, aggMonths: aggMonths, compact: compact, pctChange: pctChange, summaryTarget: summaryTarget, recapModel: recapModel, maskName: maskName, recapOfferYear: recapOfferYear };

  // ================= DOM-помічники (весь текст — лише textContent) =================

      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;

      }
    }
    return el;
  }
  var ICONS = {
    check: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5l4 4 8-9"/></svg>',
    alert: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3l8 14H2L10 3z"/><path d="M10 8v4M10 14.5v.5"/></svg>',

  };
  function icon(name) { var s = document.createElement('span'); s.style.display = 'inline-flex'; s.innerHTML = ICONS[name]; return s; } // лише власні константи

  // ================= Стан і доступ до даних =================
  var sb = null;
  var S = { session: null, ready: false, loading: false, error: null, noAccess: false, loadedAt: 0, route: parseRoute(), card: null, payData: null, studentFilter: { status: 'active', q: '' }, payMonth: kyivDateStr(Date.now()).slice(0, 7), schedWeek: mondayOf(kyivDateStr(Date.now())), weekData: null, genAt: 0, scheduleError: false, expMonth: kyivDateStr(Date.now()).slice(0, 7), expData: null, setData: null, genExpAt: 0, recurringError: false, statData: null, recapData: null, recapIdx: 0, recapYear: (function () { var t = kyivDateStr(Date.now()); return recapOfferYear(t) || Number(t.slice(0, 4)); })(), sumData: null, sumMonth: (summaryTarget(kyivDateStr(Date.now())) || kyivDateStr(Date.now()).slice(0, 7)), statType: 'month', statCursor: kyivDateStr(Date.now()).slice(0, 7) };
  var app = document.getElementById('app');

  function must(res) { if (res.error) throw res.error; return res.data; }

  async function loadAll() {
    var nowTs = Date.now();
    var today = kyivDateStr(nowTs);
    var range = dayRange(nowTs);
    var monthFirst = today.slice(0, 8) + '01';
    var iso = function (ms) { return new Date(ms).toISOString(); };

    var r = await Promise.all([
      sb.from('settings').select('*').eq('id', 1).maybeSingle(),
      sb.from('students').select('*'),
      sb.from('student_balance').select('*'),
      sb.from('lessons').select('*').gte('starts_at', iso(range.start)).lt('starts_at', iso(range.end)).order('starts_at', { ascending: true }),
      sb.from('lessons').select('*').eq('status', 'planned').lt('starts_at', iso(nowTs)).order('starts_at', { ascending: true }),
      sb.from('lessons').select('*').eq('kind', 'lesson').eq('status', 'done').eq('imported', false).eq('homework_checked', false).gte('starts_at', iso(nowTs - 30 * 86400000)).order('starts_at', { ascending: true }),
      sb.from('tasks').select('*').eq('done', false).order('due_date', { ascending: true, nullsFirst: false }),
      sb.from('tax_deadlines').select('*').gte('due_date', today).lte('due_date', addDaysStr(today, 30)).order('due_date', { ascending: true }),
      sb.from('stats_month').select('*').eq('month', monthFirst).maybeSingle(),
      sb.from('lessons').select('*').eq('status', 'planned').gte('starts_at', iso(range.end)).order('starts_at', { ascending: true }).limit(1),
      sb.from('expenses').select('*').eq('status', 'pending').lte('spent_at', today).order('spent_at', { ascending: true })
    ]);
    var settingsRes = r[0];
    if (settingsRes.error) throw settingsRes.error;
    if (!settingsRes.data) { S.noAccess = true; return; }
    // спершу збираємо все окремо: якщо щось не завантажилось, стара картинка лишається цілою
    var next = { settings: settingsRes.data };
    next.students = must(r[1]) || [];
    next.studentMap = {};
    next.students.forEach(function (x) { next.studentMap[x.id] = x; });
    next.balances = must(r[2]) || [];
    next.todayLessons = must(r[3]) || [];
    next.openPlanned = must(r[4]) || [];      // заняття, час яких минув, а статус досі «заплановано»
    next.hwLessons = must(r[5]) || [];
    next.manualTasks = must(r[6]) || [];
    next.deadlines = must(r[7]) || [];
    next.month = r[8].error ? null : r[8].data;
    next.nextLesson = (must(r[9]) || [])[0] || null;
    next.pendingExpenses = r[10].error ? [] : (r[10].data || []);
    // прогрес підсумків місяця (лише коли їх пора писати)
    var target = summaryTarget(today), progress = null;
    if (target) {
      var rg = monthRangeUtc(target);
      var pr = await Promise.all([
        sb.from('lessons').select('student_id').eq('kind', 'lesson').eq('status', 'done').gte('starts_at', iso(rg.start)).lt('starts_at', iso(rg.end)),
        sb.from('monthly_summaries').select('student_id,text').eq('month', target + '-01')
      ]);
      if (!pr[0].error && !pr[1].error) {
        var ids = {};
        (pr[0].data || []).forEach(function (x) { ids[x.student_id] = 1; });
        progress = { month: target, total: Object.keys(ids).length, written: (pr[1].data || []).filter(function (x) { return ids[x.student_id] && String(x.text || '').trim(); }).length };
      }
    }
    next.summaryProgress = progress;
    next.todayStr = today;
    next.loadedAt = nowTs;
    next.noAccess = false;
    Object.assign(S, next);
  }

  async function refresh(opts) {
    if (!sb || !S.session) return;
    S.loading = true; S.error = null;
    if (!opts || !opts.silent) render();
    try { await generateSchedule(null, false); await generateRecurring(false); await loadAll(); if (!S.noAccess) await loadRouteData(); }
    catch (e) { console.error(e); S.error = 'Не вдалося завантажити дані. Перевір інтернет і натисни «Оновити».'; }
    S.loading = false;
    render();
  }

  // ================= Повідомлення і вікна =================
  function toast(message, o) {
    o = o || {};
    var box = document.getElementById('toasts');
    var el = h('div', { class: 'toast' + (o.error ? ' err' : ''), role: 'status' }, h('span', { text: message }));
    var timer;
    function close() { clearTimeout(timer); el.remove(); }
    if (o.actionLabel) el.append(h('button', { class: 'btn link', type: 'button', text: o.actionLabel, onclick: function () { close(); o.onAction && o.onAction(); } }));
    box.append(el);
    timer = setTimeout(close, o.ms || (o.error ? 7000 : 6000));
  }
  function fail(e) { console.error(e); toast('Не вдалося виконати дію. Перевір інтернет і спробуй ще раз.', { error: true }); }

  function openModal(title, who, content, opts) {
    var prevFocus = document.activeElement;
    var overlay = h('div', { class: 'overlay' });
    var modal = h('div', { class: 'modal' + (opts && opts.wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
      h('h2', { text: title }), who ? h('p', { class: 'who', text: who }) : null, content);
    overlay.append(modal);
    function close() {
      document.removeEventListener('keydown', onKey);
      overlay.remove();
      if (prevFocus && prevFocus.focus) prevFocus.focus();
    }
    function onKey(e) { if (e.key === 'Escape') close(); }
    overlay.addEventListener('mousedown', function (e) { if (e.target === overlay) close(); });
    document.addEventListener('keydown', onKey);
    document.body.append(overlay);
    var first = modal.querySelector('button, textarea, input');
    if (first) first.focus();
    return close;
  }

  // кнопка, що блокується на час дії
  function act(btn, fn) {
    return async function () {
      if (btn.disabled) return;
      btn.disabled = true;
      try { await fn(); } catch (e) { fail(e); } finally { btn.disabled = false; }
    };
  }
  function actButton(cls, label, fn, ic) {
    var b = h('button', { class: 'btn ' + cls, type: 'button' }, ic ? icon(ic) : null, label);
    b.addEventListener('click', act(b, fn));
    return b;
  }

  // ================= Дії з даними =================
  async function setLessonStatus(id, patch) {
    must(await sb.from('lessons').update(patch).eq('id', id));
  }

  async function markDone(l, closeFn) {
    await setLessonStatus(l.id, { status: 'done' });
    if (closeFn) closeFn();
    await refresh({ silent: true });
    var bal = null;
    if (l.student_id) { var b = S.balances.find(function (x) { return x.student_id === l.student_id; }); bal = b ? b.balance : null; }
    toast('Заняття проведено.' + (bal != null ? ' ' + balanceText(bal) + '.' : ''), {
      actionLabel: 'Нотатка',
      onAction: function () { openNoteDialog(l); },
      ms: 9000
    });
  }
  async function undoDone(l) {
    try { await setLessonStatus(l.id, { status: 'planned' }); await refresh({ silent: true }); } catch (e) { fail(e); }
  }

  function openNoteDialog(l) {
    var ta = h('textarea', { 'aria-label': 'Нотатка до заняття', placeholder: 'Що пройшли, що задали' });
    ta.value = l.notes || '';
    var close;
    var save = actButton('primary', 'Зберегти', async function () {
      must(await sb.from('lessons').update({ notes: ta.value.trim() || null }).eq('id', l.id));
      close(); await refresh({ silent: true }); toast('Нотатку збережено.');
    });
    var skip = h('button', { class: 'btn ghost', type: 'button', text: 'Закрити', onclick: function () { close(); } });
    var who = l.kind === 'consultation' ? l.guest_name : ((S.studentMap[l.student_id] || {}).name || '');

  async function countReschedulesThisMonth(studentId) {

    var nextFirst = addDaysStr(first, new Date(Date.UTC(p[0], p[1], 0)).getUTCDate());

  async function rescheduleLesson(l, wallValue, closeFn) {

      var insRes = await sb.from('lessons').insert(row).select().single();
      if (insRes.error) {
        if (insRes.error.code === '23505') { toast('У цього учня вже є заняття на цей час. Обери інший час.', { error: true }); return; }

      var les = must(r[0]) || [];
      if (S.route !== route) return;
      pays.sort(function (a, b) { return String(b.paid_at).localeCompare(String(a.paid_at)); });

      var pkgs = [];
      if (rows.length) pkgs = must(await sb.from('packages').select('*').in('id', rows.map(function (x) { return x.package_id; }))) || [];
      var oth = await sb.from('other_income').select('*').gte('received_at', first).lt('received_at', nextFirst).order('received_at', { ascending: false });
      var othRows = oth.error ? [] : (oth.data || []);
      if (S.route !== route || S.payMonth !== month) return;
      var pkgMap = {};
      pkgs.forEach(function (x) { pkgMap[x.id] = x; });
      S.payData = { month: month, rows: rows, pkgMap: pkgMap, other: othRows };
    } else if (route.name === 'schedule') {
      var wk = S.schedWeek, a = wk.split('-').map(Number);

      var wkRows = must(await sb.from('lessons').select('*')

    } else if (route.name === 'expenses') {

      if (S.route !== route || S.expMonth !== em) return;
      S.expData = { month: em, rows: erows };
    } else if (route.name === 'settings') {
      var r2 = await Promise.all([

      ]);
      var dl = must(r2[0]) || [];

    } else if (route.name === 'summaries') {
      var sm = S.sumMonth, rg2 = monthRangeUtc(sm);
      var r4 = await Promise.all([

        sb.from('monthly_summaries').select('*').eq('month', sm + '-01')
      ]);
      var dl2 = must(r4[0]) || [], sums = must(r4[1]) || [];

      dl2.forEach(function (l) { var x = (per[l.student_id] = per[l.student_id] || { id: l.student_id, done: 0, minutes: 0, written: false }); x.done++; x.minutes += l.duration_min || 50; });
      sums.forEach(function (x) { if (per[x.student_id] && x.text && String(x.text).trim()) per[x.student_id].written = true; });
      var list = Object.keys(per).map(function (k) { var x = per[k]; x.name = (S.studentMap[k] || {}).name || 'Учень'; return x; })

      for (;;) {

  // ================= Крок 4: розклад =================
  function mondayOf(dateStr) {
    var a = dateStr.split('-').map(Number);
    var dow = new Date(Date.UTC(a[0], a[1] - 1, a[2])).getUTCDay(); // 0 = неділя
    return addDaysStr(dateStr, -((dow + 6) % 7));
  }
  var dayFmt = new Intl.DateTimeFormat('uk-UA', { timeZone: 'UTC', weekday: 'long', day: 'numeric', month: 'long' });
  var dmFmt = new Intl.DateTimeFormat('uk-UA', { timeZone: 'UTC', day: 'numeric', month: 'long' });
  function utcDate(dateStr) { var a = dateStr.split('-').map(Number); return new Date(Date.UTC(a[0], a[1] - 1, a[2])); }
  function dayLabel(dateStr) { var s = dayFmt.format(utcDate(dateStr)); return s.charAt(0).toUpperCase() + s.slice(1); }
  function weekLabel(wk) {
    var end = addDaysStr(wk, 6);
    return wk.slice(5, 7) === end.slice(5, 7) ? Number(wk.slice(8)) + '–' + dmFmt.format(utcDate(end)) : dmFmt.format(utcDate(wk)) + ' – ' + dmFmt.format(utcDate(end));
  }
  function isoOf(ms) { return new Date(ms).toISOString(); }

  // Створення занять за постійним розкладом (функція в базі, безпечна до повторних викликів)
  async function generateSchedule(studentId, force) {
    if (!force && Date.now() - S.genAt < 60000) return 0;
    S.genAt = Date.now();
    var res = await sb.rpc('generate_schedule_lessons', studentId ? { p_student_id: studentId } : {});
    if (res.error) { console.warn(res.error); S.scheduleError = true; return null; }
    S.scheduleError = false;
    return res.data || 0;
  }
  function createdText(n) {
    var w = S.settings ? S.settings.schedule_horizon_weeks : 2;
    return 'Створено ' + n + ' ' + lessonsWord(n) + ' за розкладом на ' + w + ' ' + plural(w, 'тиждень', 'тижні', 'тижнів') + ' наперед.';
  }
  var SCHEDULE_FIX = 'Заняття за розкладом не створено: запусти файл 06_schedule.sql у Supabase.';

  async function hasFutureGenerated(studentId) {
    var res = await sb.from('lessons').select('id').eq('student_id', studentId).eq('from_schedule', true).eq('status', 'planned').gte('starts_at', isoOf(Date.now())).limit(1);
    return !res.error && !!(res.data && res.data.length);
  }
  function normSchedule(arr) {
    return JSON.stringify((arr || []).map(function (x) { return { weekday: Number(x.weekday), time: x.time }; })
      .sort(function (a, b) { return a.weekday - b.weekday || String(a.time).localeCompare(String(b.time)); }));
  }

      if (res.error) throw res.error;
      close(); await refresh({ silent: true });
      toast(hasNew ? createdText(res.data || 0) : 'Майбутні заняття за старим розкладом видалено.');
    });

        apply, keep));

  // ---------- додати, змінити, видалити заняття ----------
  async function findConflicts(startMs, durMin, excludeId) {
    var res = await sb.from('lessons').select('*').gte('starts_at', isoOf(startMs - 6 * 3600000)).lt('starts_at', isoOf(startMs + durMin * 60000)).in('status', ['planned', 'done', 'lost']);
    if (res.error) return [];
    return (res.data || []).filter(function (l) {
      if (l.id === excludeId) return false;
      var s = new Date(l.starts_at).getTime(), e = s + (l.duration_min || 50) * 60000;
      return s < startMs + durMin * 60000 && e > startMs;
    });
  }
  function lessonWho(l) { return l.kind === 'consultation' ? l.guest_name : ((S.studentMap[l.student_id] || {}).name || 'учень'); }

  function openLessonForm(o) {
    o = o || {};
    var edit = o.edit || null;
    var kind = edit ? edit.kind : 'lesson';
    var err = errBox();
    var warn = h('div', { class: 'note late', role: 'alert', hidden: true });
    var confirmed = false, durTouched = !!edit;
    var defDur = function (id) { var st = S.studentMap[id]; return (st && st.lesson_duration_min) || S.settings.default_duration_min || 50; };

    var stOpts = [['', 'Обери учня']].concat(S.students.filter(function (s) { return s.status !== 'ended' || (edit && s.id === edit.student_id); })
      .sort(function (a, b) { return a.name.localeCompare(b.name, 'uk'); }).map(function (s) { return [s.id, s.name]; }));
    var student = sel(stOpts, edit ? edit.student_id : '');
    var guest = h('input', { type: 'text', maxlength: '120', autocomplete: 'off', placeholder: 'Імʼя людини' }); guest.value = edit && edit.guest_name ? edit.guest_name : '';
    var startMs0 = edit ? new Date(edit.starts_at).getTime() : null;
    var date = h('input', { type: 'date' }); date.value = edit ? kyivDateStr(startMs0) : (o.date || todayStr());
    var time = h('input', { type: 'time' }); time.value = edit ? fmtTime(startMs0) : '';
    var dur = h('input', { type: 'text', inputmode: 'numeric', autocomplete: 'off' }); dur.value = edit ? String(edit.duration_min || 50) : String(S.settings.default_duration_min || 50);
    var hint = h('div', { class: 'hint' });

    var studentField = field('Учень', student), guestField = field('Імʼя', guest);
    var seg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Тип' });
    function drawKind() {
      studentField.hidden = kind !== 'lesson'; guestField.hidden = kind !== 'consultation';
      if (!edit) {
        seg.replaceChildren.apply(seg, [['lesson', 'Заняття'], ['consultation', 'Консультація']].map(function (k) {
          return h('button', { class: 'seg-btn', type: 'button', 'aria-pressed': String(kind === k[0]), text: k[1], onclick: function () { kind = k[0]; resetConfirm(); drawKind(); } });
        }));
      }
    }
    function updateHint() {
      var ms = /^\d{4}-\d{2}-\d{2}$/.test(date.value) && /^\d{2}:\d{2}$/.test(time.value) ? parseWallString(date.value + 'T' + time.value) : NaN;
      hint.textContent = !isNaN(ms) && ms < Date.now() ? 'Це час у минулому: заняття зʼявиться в «Не забути», щоб ти його відмітила.' : '';
    }
    var save;
    function resetConfirm() { confirmed = false; warn.hidden = true; if (save) save.textContent = 'Зберегти'; updateHint(); }
    [date, time, dur, student].forEach(function (el) { el.addEventListener('input', resetConfirm); el.addEventListener('change', resetConfirm); });
    dur.addEventListener('input', function () { durTouched = true; });
    student.addEventListener('change', function () { if (!durTouched && student.value) dur.value = String(defDur(student.value)); });

    var close;
    save = actButton('primary', 'Зберегти', async function () {
      err.hidden = true;
      var sid = student.value || null;
      if (kind === 'lesson' && !sid) { showErr(err, 'Обери учня.'); student.focus(); return; }
      var gname = guest.value.trim();
      if (kind === 'consultation' && !gname) { showErr(err, 'Вкажи імʼя людини для консультації.'); guest.focus(); return; }
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date.value)) { showErr(err, 'Вкажи дату.'); date.focus(); return; }
      if (!/^\d{2}:\d{2}$/.test(time.value)) { showErr(err, 'Вкажи час початку.'); time.focus(); return; }
      var d = dur.value.trim(), dn = Number(d);
      if (!/^\d+$/.test(d) || dn < 10 || dn > 240) { showErr(err, 'Тривалість заняття: число хвилин від 10 до 240.'); dur.focus(); return; }
      var ms = parseWallString(date.value + 'T' + time.value);
      if (isNaN(ms)) { showErr(err, 'Не вдалося прочитати дату й час.'); return; }
      var conflicts = await findConflicts(ms, dn, edit && edit.id);
      var same = kind === 'lesson' && conflicts.some(function (c) { return c.kind === 'lesson' && c.student_id === sid && new Date(c.starts_at).getTime() === ms; });
      if (same) { showErr(err, 'У цього учня вже є заняття на цей час.'); return; }
      if (conflicts.length && !confirmed) {
        warn.textContent = 'У цей час уже є: ' + conflicts.map(function (c) { return fmtTime(new Date(c.starts_at).getTime()) + ' ' + lessonWho(c); }).join(', ') + '. Якщо так і задумано, збережи ще раз.';
        warn.hidden = false; confirmed = true; save.textContent = 'Все одно зберегти';
        return;
      }
      var row = kind === 'lesson'
        ? { student_id: sid, guest_name: null, starts_at: isoOf(ms), duration_min: dn }
        : { student_id: null, guest_name: gname, starts_at: isoOf(ms), duration_min: dn };
      var res;
      if (edit) res = await sb.from('lessons').update(row).eq('id', edit.id);
      else res = await sb.from('lessons').insert(Object.assign({ kind: kind, status: 'planned', from_schedule: false }, row));
      if (res.error) {
        if (res.error.code === '23505') { showErr(err, 'У цього учня вже є заняття на цей час.'); return; }
        throw res.error;
      }
      close();
      if (S.route.name === 'schedule') { S.schedWeek = mondayOf(date.value); S.weekData = null; }
      await refresh({ silent: true });
      toast((edit ? 'Заняття змінено: ' : 'Заняття додано: ') + dayLabel(date.value).toLowerCase() + ', ' + time.value + '.');
    });
    drawKind(); updateHint();
    var content = h('div', { class: 'stack' }, err,
      edit ? null : h('div', { class: 'field' }, h('div', { class: 'label-like', text: 'Що додаємо' }), seg),
      studentField, guestField,
      h('div', { class: 'form-grid' }, field('Дата', date), field('Час початку (київський)', time)),
      hint,
      field('Тривалість, хв', dur),
      warn,
      h('div', { class: 'slot-actions' }, save, h('button', { class: 'btn ghost', type: 'button', text: 'Скасувати', onclick: function () { close(); } })));
    close = openModal(edit ? 'Змінити заняття' : 'Нове заняття', edit ? lessonWho(edit) : null, content, { wide: true });
  }

  var CATEGORIES = { taxes: 'Податки', subscriptions: 'Підписки', education: 'Навчання', materials: 'Матеріали', other: 'Інше' };
  var RECUR = { none: 'Не повторюється', monthly: 'Щомісяця', quarterly: 'Щокварталу' };
  var MIGRATION7 = 'Спершу запусти файл 07_expenses.sql у Supabase.';
  function uuid() {
    if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) { var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
  }

  var BACKUP_TABLES = ['settings', 'students', 'packages', 'payments', 'lessons', 'expenses', 'tasks', 'tax_deadlines', 'monthly_summaries', 'other_income'];
  async function fetchAllRows(table) {

      var page = must(await sb.from(table).select('*').order('id', { ascending: true }).range(from, from + size - 1)) || [];
      out = out.concat(page);
      if (page.length < size) return out;
      from += size;
    }
  }
  async function saveBackup() {
    var tables = {};

    var nowIso = new Date().toISOString();
    var payload = { app: 'my-crm', created_at: nowIso, tables: tables };

      if (edit) {

  // ================= Крок 6: статистика =================
  var Q_ROMAN = ['I', 'II', 'III', 'IV'];

  var monthShortFmt = new Intl.DateTimeFormat('uk-UA', { timeZone: 'UTC', month: 'short' });

  function periodStartYm(type, ym) {

  // та сама арифметика, що у виглядах stats_quarter / stats_year у базі
  function aggMonths(rows) {

    var byYm = {};
    monthRows.forEach(function (r) { byYm[r.month.slice(0, 7)] = r; });
    var sorted = monthRows.slice().sort(function (a, b) { return a.month.localeCompare(b.month); });
    var first = sorted.find(isActiveMonth);

    var model = { empty: false, type: type, startYm: startYm, nowYm: nowYm, cursor: curStart, label: periodLabel(type, curStart), cur: aggMonths(rowsOf(curStart)) };
    model.isCurrent = curStart === periodStartYm(type, nowYm);
    model.canPrev = shiftMonth(curStart, -span) >= minCur;
    model.canNext = curStart < maxCur;
    // попередній період

  // Усі картки рекапу рахуються тут (окремо від екрана, щоб це можна було перевірити)
  function recapModel(a) {

    var sm = statsModel(a.months, 'year', year + '-06', nowYm, a.cfg);
    if (sm.empty || sm.cursor.slice(0, 4) !== year) return { empty: true, year: year };
    var done = a.lessons.filter(function (l) { return l.kind === 'lesson' && l.status === 'done'; }).map(function (l) {

    }).filter(function (x) { return String(x.y) === year; });
    var c = sm.cur;
    if (!done.length && !(c.income > 0) && !(c.lessons_done > 0)) return { empty: true, year: year };
    var partial = year === today.slice(0, 4);
    var cards = [];
    var cnt = function (n) { return n + ' ' + lessonsWord(n); };

    cards.push({ key: 'intro', lead: 'Твій рік у цифрах', big: year, lines: [partial ? 'Станом на ' + dmFmt.format(utcDate(today)) : 'Підсумок року'] });

    cards.push({ key: 'lessons', lead: 'Цього року ти провела', big: String(c.lessons_done), count: { value: c.lessons_done, fmt: 'int' }, unit: lessonsWord(c.lessons_done), lines: ['Це ' + fmtHours(c.hours) + ' з учнями'] });

    // учні

    var ids = Object.keys(perStudent), n = ids.length;
    var started = (a.students || []).filter(function (s) { return s.start_date && s.start_date.slice(0, 4) === year; }).length;
    var anyStart = (a.students || []).some(function (s) { return s.start_date; });
    if (n > 0) {
      var sLines = [];
      if (anyStart) sLines.push('Цього року до тебе прийшло ' + started + ' ' + plural(started, 'новий учень', 'нових учні', 'нових учнів'));

    }
    if (n >= 2) {

      var topId = topKey(perStudent, function (x, y) { return String(nameOf[x] || x).localeCompare(String(nameOf[y] || y), 'uk') < 0; });
      cards.push({ key: 'top', lead: 'Найбільше занять ти провела з', big: maskName(nameOf[topId] || 'Учень'), textBig: true, unit: cnt(perStudent[topId]) });
    }

  function animateCount(el, value, fmt) {

        })));

    return h('li', { class: 'item' },
      h('div', { class: 'item-main' },
        t.danger ? h('span', { class: 'danger-text' }, icon('alert'), t.text) : h('span', { text: t.text }),
        t.sub ? h('div', { class: 'item-sub', text: t.sub }) : null),
      actions);
  }

  function renderTasks() {
    var tasks = buildTasks(S);
    var input = h('input', { type: 'text', 'aria-label': 'Нове завдання', placeholder: 'Нове завдання', maxlength: '200' });
    var due = h('input', { type: 'date', 'aria-label': 'Термін' });
    var add = h('button', { class: 'btn ghost', type: 'button', text: 'Додати' });
    add.addEventListener('click', act(add, async function () {
      var text = input.value.trim();
      if (!text) { input.focus(); return; }
      must(await sb.from('tasks').insert({ text: text, due_date: due.value || null }));
      input.value = ''; due.value = '';
      await refresh({ silent: true });
    }));
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') add.click(); });
    return h('section', { class: 'section' },
      h('div', { class: 'section-head' }, h('h2', { text: 'Не забути' }), tasks.length ? h('span', { class: 'count', text: tasks.length }) : null),
      tasks.length ? h('ul', { class: 'list' }, tasks.map(taskItem)) : h('p', { class: 'item-sub', text: 'Усе зроблено.' }),
      h('div', { class: 'add-task' }, input, due, add));
  }

  function payItem(b, danger) {
    var st = S.studentMap[b.student_id];
    return h('li', { class: 'item' },
      h('div', { class: 'item-main' }, h('span', { text: st.name })),
      danger ? h('span', { class: 'danger-text' }, icon('alert'), balanceText(b.balance)) : h('span', { class: 'item-sub', text: balanceText(b.balance) }));
  }
  function renderPayments() {
    var p = buildPayments(S);
    var children = [h('div', { class: 'section-head' }, h('h2', { text: 'Оплати' }))];
    if (!p.debt.length && !p.now.length && !p.soon.length) {
      children.push(h('p', { class: 'item-sub', text: 'Усі учні з оплаченими заняттями.' }));
    } else {
      if (p.debt.length) children.push(h('div', { class: 'debt-box' }, h('p', { class: 'sub-title', text: 'У боргу' }), h('ul', { class: 'list' }, p.debt.map(function (b) { return payItem(b, true); }))));
      if (p.now.length) children.push(h('p', { class: 'sub-title', text: 'Потрібна оплата' }), h('ul', { class: 'list' }, p.now.map(function (b) { return payItem(b, false); })));
      if (p.soon.length) children.push(h('p', { class: 'sub-title', text: 'Скоро оплата' }), h('ul', { class: 'list' }, p.soon.map(function (b) { return payItem(b, false); })));
    }
    return h('section', { class: 'section' }, children);
  }

  function renderBirthdays() {
    var list = buildBirthdays(S);
    if (!list.length) return null;
    return h('section', { class: 'section' },
      h('div', { class: 'section-head' }, h('h2', { text: 'Дні народження' })),
      h('ul', { class: 'list' }, list.map(function (x) {
        return h('li', { class: 'item' },
          h('div', { class: 'item-main', text: x.student.name }),
          h('span', { class: 'item-sub', text: x.days === 0 ? 'Сьогодні' : x.days === 1 ? 'Завтра' : fmtDayMonth(x.student.birthday) + ', через ' + x.days + ' ' + plural(x.days, 'день', 'дні', 'днів') }));
      })));
  }

  function renderSummary() {
    var m = S.month || {};
    var income = Number(m.income) || 0, done = Number(m.lessons_done) || 0;
    var monthName = new Intl.DateTimeFormat('uk-UA', { timeZone: TZ, month: 'long' }).format(new Date());
    return h('div', { class: 'summary', role: 'region', 'aria-label': 'Підсумок місяця' },
      h('span', {}, h('span', { class: 'big', text: money(income) }), h('span', { class: 'lbl', text: 'дохід, ' + monthName })),
      h('span', {}, h('span', { class: 'big', text: String(done) }), h('span', { class: 'lbl', text: plural(done, 'проведене заняття', 'проведені заняття', 'проведених занять') })));
  }

  function topbar(withTools) {
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    var tools = h('div', { class: 'tools' });
    if (withTools) {
      var r = h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Оновити дані', onclick: function () { refresh(); } }, icon('refresh'));
      tools.append(r);
    }
    tools.append(h('button', {
      class: 'icon-btn', type: 'button', 'aria-label': 'Змінити тему',
      onclick: function () {
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('crm-theme', next); } catch (e) {}
        render();
      }
    }, icon(dark ? 'sun' : 'moon')));
    if (withTools) tools.append(h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Вийти', onclick: signOut }, icon('out'), h('span', { text: 'Вийти' })));
    var cur = S.route.name === 'student' || S.route.name === 'summaries' ? 'students' : S.route.name;
    var nav = withTools ? h('nav', { class: 'nav', 'aria-label': 'Розділи' }, [['home', 'Головна', '#/'], ['schedule', 'Розклад', '#/schedule'], ['students', 'Учні', '#/students'], ['payments', 'Оплати', '#/payments'], ['expenses', 'Витрати', '#/expenses'], ['stats', 'Статистика', '#/stats'], ['settings', 'Налаштування', '#/settings']].map(function (n) {
      return h('a', { href: n[2], 'aria-current': cur === n[0] ? 'page' : null, text: n[1] });
    })) : null;
    return h('header', { class: 'topbar' }, h('div', { class: 'brand', text: 'Мій CRM' }), nav, tools);
  }

  function renderLogin(message) {
    var email = h('input', { type: 'email', id: 'email', autocomplete: 'email', required: true, placeholder: 'name@example.com' });
    var out = h('div');
    var go = h('button', { class: 'btn primary', type: 'submit', text: 'Отримати посилання для входу' });
    var form = h('form', { novalidate: true }, h('div', { class: 'field' }, h('label', { for: 'email', text: 'Email' }), email), go, out);
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      var v = email.value.trim();
      if (!/^\S+@\S+\.\S+$/.test(v)) { out.replaceChildren(h('div', { class: 'msg err', text: 'Введи email повністю, наприклад name@example.com.' })); return; }
      go.disabled = true;
      var res = await sb.auth.signInWithOtp({ email: v, options: { shouldCreateUser: false, emailRedirectTo: location.origin + location.pathname } });
      go.disabled = false;
      if (res.error) out.replaceChildren(h('div', { class: 'msg err', text: 'Не вдалося надіслати посилання. Перевір, що цей email додано в Supabase (Authentication, Users), і спробуй ще раз.' }));
      else out.replaceChildren(h('div', { class: 'msg', text: 'Посилання надіслано. Відкрий лист і натисни на нього в цьому ж браузері.' }));
    });
    app.replaceChildren(topbar(false), h('main', { class: 'center' }, h('h1', { text: 'Вхід' }), h('p', { text: 'Надішлемо посилання на твій email. Пароль не потрібен.' }), message ? h('div', { class: 'msg err', text: message }) : null, form));
  }

  function render() {
    if (!S.ready) return;
    if (S.route.name !== 'recap') setRecapKeys(null);
    if (!S.session) { renderLogin(); return; }
    if (S.noAccess) {
      app.replaceChildren(topbar(true), h('main', { class: 'center' }, h('h1', { text: 'Немає доступу' }), h('p', { text: 'Цей акаунт не має права читати дані CRM. Вийди й увійди з email, який вказано у функції is_owner() в базі.' })));
      return;
    }
    if (!S.settings) {
      app.replaceChildren(topbar(true), h('main', { class: 'center' }, h('h1', { text: S.error ? 'Помилка' : 'Завантаження' }), S.error ? h('div', { class: 'msg err', text: S.error }) : h('p', { text: 'Читаю дані…' })));
      return;
    }
    var view;
    switch (S.route.name) {
      case 'students': view = renderStudents(); break;
      case 'student': view = renderStudentCard(); break;
      case 'payments': view = renderPaymentsPage(); break;
      case 'schedule': view = renderSchedulePage(); break;
      case 'expenses': view = renderExpensesPage(); break;
      case 'settings': view = renderSettingsPage(); break;
      case 'stats': view = renderStatsPage(); break;
      case 'summaries': view = renderSummariesPage(); break;
      case 'recap': app.replaceChildren(renderRecap()); return;
      default: view = renderHome();
    }
    app.replaceChildren(topbar(true), view);
  }

  function renderHome() {
    var left = h('div', {}, renderToday());
    var right = h('div', {}, renderTasks(), renderPayments(), renderBirthdays());
    return h('main', { class: 'page' },
      S.error ? h('div', { class: 'msg err', role: 'alert', text: S.error }) : null,
      h('div', { class: 'grid' }, left, right),
      renderSummary());
  }

  async function signOut() { await sb.auth.signOut(); S.settings = null; render(); }

  // ================= Запуск =================
  async function init() {
    if (!window.supabase) {
      app.replaceChildren(h('main', { class: 'center' }, h('h1', { text: 'Немає зв’язку' }), h('p', { text: 'Не вдалося завантажити бібліотеку Supabase. Перевір інтернет і онови сторінку.' })));
      return;
    }
    sb = window.supabase.createClient(CONFIG.url, CONFIG.key);
    var res = await sb.auth.getSession();
    S.session = res.data && res.data.session;
    S.ready = true;
    window.addEventListener('hashchange', onRouteChange);
    sb.auth.onAuthStateChange(function (event, session) {
      var had = !!S.session;
      S.session = session;
      if (session && !had) { S.settings = null; refresh(); }
      else if (!session) render();
    });
    if (S.session) await refresh(); else render();
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState !== 'visible' || !S.session || S.loading) return;
      if (document.querySelector('.overlay')) return;
      var typing = document.querySelector('.add-task input[type="text"]');
      if (typing && typing.value) return;
      if (Date.now() - S.loadedAt > 60000) refresh({ silent: true });
    });
  }
  window.CRM_STATE = S;
  window.CRM_READY = init();
})();
</script>
</body>
</html>
