.brandf,.hi h2,h1.t,.tile b.n,.les b,.face .w,.face .tr,.sheet h3,.state-t,.ph2 b{font-family:"KyivType Sans",Onest,system-ui,sans-serif}
#splash{position:fixed;inset:0;z-index:100;background:#fff;display:flex;align-items:center;justify-content:center;transition:opacity .5s;cursor:pointer}
#splash img{width:min(92vw,560px);height:auto}
#splash.hide{opacity:0;pointer-events:none}
:root{--bg:#12261F;--bg2:#0f211b;--card:#17382E;--card2:#1d4639;--text:#F5F0E6;--muted:#8fa89c;--line:#24493c;--acc:#D6CBF2;--accd:#12261F;--ok:#9fd8b4;--warn:#f0c987;--sheet:#1a3f33;--pillbg:#1d4639}
[data-theme="light"]{--bg:#E8EFEA;--bg2:#DCE8E0;--card:#F7FAF8;--card2:#DDE9E1;--text:#12261F;--muted:#5d746a;--line:#c2d5ca;--acc:#12261F;--accd:#F5F0E6;--ok:#1f6b45;--warn:#8a5a00;--sheet:#F1F6F3;--pillbg:#cfe0d6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Onest,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.4;transition:background .3s,color .3s;overflow:hidden}
a{color:inherit;text-decoration:none}
svg{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.shell{position:relative;height:100dvh;max-width:480px;margin:0 auto;overflow:hidden;background:var(--bg)}
@media(min-width:520px){body{background:#0b1511}[data-theme="light"] body{background:#cfdcd4}.shell{box-shadow:0 0 60px rgba(0,0,0,.4)}}
.panels{position:absolute;inset:0 0 calc(74px + env(safe-area-inset-bottom)) 0;overflow:hidden}
.panel{position:absolute;inset:0;overflow-y:auto;padding:calc(22px + env(safe-area-inset-top)) 18px 30px;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .5s cubic-bezier(.34,1.56,.64,1);scrollbar-width:none;overscroll-behavior:contain}
.panel::-webkit-scrollbar{display:none}
.panel.before,.panel.after{transform:scale(.95) translateY(14px)}
.panel.on{opacity:1;pointer-events:auto;transform:none}
@media(prefers-reduced-motion:reduce){.panel{transition:opacity .2s}.panel.before,.panel.after{transform:none}}
h1.t{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:2px 0 14px}
.hi small{color:var(--muted);font-size:13px}.hi h2{font-size:27px;line-height:1.12;font-weight:700;letter-spacing:-.02em;margin:4px 0 14px}
.toprow{display:flex;justify-content:space-between;align-items:flex-start}
.thm{border:0;background:var(--card);color:var(--text);width:38px;height:38px;border-radius:50%;font-size:17px;cursor:pointer}
.card{background:var(--card);border-radius:22px;padding:16px}
.next b{display:block;font-size:19px;font-weight:600}.next span{color:var(--muted);font-size:13px;display:block;margin:2px 0 14px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;display:inline-flex;gap:7px;align-items:center;justify-content:center;border:0;border-radius:14px;padding:12px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;background:var(--card2);color:var(--text);transition:transform .15s;text-align:center}
.btn.pri{background:var(--acc);color:var(--accd)}.btn:active{transform:scale(.95)}.btn:disabled{opacity:.5}.btn[hidden],.tile[hidden]{display:none}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{background:var(--card);border-radius:22px;padding:16px;cursor:pointer;transition:transform .15s}.tile:active{transform:scale(.96)}
.tile b.n{display:block;font-size:36px;line-height:1;color:var(--acc);font-weight:700}.tile span{font-size:12.5px;color:var(--muted)}
.tile.wide{grid-column:1/-1;display:flex;align-items:center;gap:12px}.tile.wide em{font-style:normal;flex:none;width:40px;height:40px;border-radius:13px;background:var(--card2);color:var(--acc);display:grid;place-items:center;font-size:19px}
.tile.wide div{flex:1;min-width:0}.tile.wide b{display:block;font-size:15px}.tile.wide u{text-decoration:none;font-size:22px;color:var(--muted)}
.warn{background:var(--card);border:1px solid var(--warn);border-radius:22px;padding:14px 16px;margin-top:10px;font-size:14px}.warn span{color:var(--muted);display:block;margin-top:2px}
.sr{display:flex;gap:9px;align-items:center;background:var(--card);border-radius:16px;padding:12px 14px}.sr input{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:15px;min-width:0}.sr input::placeholder{color:var(--muted)}
.chips{display:flex;gap:7px;margin:12px 0;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--card);color:var(--muted);font:inherit;font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}.chip.on{background:var(--acc);color:var(--accd);font-weight:600}
.les{background:var(--card);border-radius:20px;padding:15px 16px;margin-bottom:10px;cursor:pointer;transition:transform .15s;animation:rise .35s both}.les:active{transform:scale(.98)}
.les small{color:var(--muted);font-size:12px}.les b{display:block;font-size:17.5px;margin:2px 0}.les p{color:var(--muted);font-size:13px}
.tags{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}.tag{font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--acc)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.empty{color:var(--muted);text-align:center;padding:26px 8px;font-size:14px}
.tabs{display:flex;background:var(--card);border-radius:14px;padding:3px;gap:2px;margin-bottom:14px}.tabs button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:13px;font-weight:600;padding:9px 0;border-radius:11px;cursor:pointer}.tabs button.on{background:var(--text);color:var(--bg)}
.bar{height:5px;border-radius:3px;background:var(--card);margin:0 0 12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .5s cubic-bezier(.3,.9,.3,1)}
.cnt{text-align:center;color:var(--muted);font-size:13px;margin-bottom:10px}.dots{letter-spacing:3px;color:var(--acc)}
.stage{position:relative;height:250px;perspective:900px}
.fc{position:absolute;inset:0;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.fc .in{position:absolute;inset:0;transition:transform .55s cubic-bezier(.3,.9,.3,1);transform-style:preserve-3d}.fc.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;background:var(--card);border:1px solid var(--line);border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center}
.face.back{transform:rotateY(180deg)}
.face .w{font-size:36px;font-weight:600;overflow-wrap:anywhere}.face .tr{font-size:25px}.face .ex{color:var(--muted);font-style:italic;font-size:14.5px}.face .h{color:var(--muted);font-size:12.5px}
.sp{width:46px;height:46px;flex:none;border-radius:50%;border:0;background:var(--card2);color:var(--acc);font-size:19px;cursor:pointer;display:grid;place-items:center}.sp:active{transform:scale(.9)}.sp.s{width:36px;height:36px;font-size:15px}
.fc.out-r{transition:transform .45s ease,opacity .45s;transform:translateX(130%) rotate(14deg);opacity:0}.fc.out-l{transition:transform .45s ease,opacity .45s;transform:translateX(-130%) rotate(-14deg);opacity:0}
.fc.enter{animation:pop .4s cubic-bezier(.34,1.56,.64,1)}@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.acts{display:flex;gap:10px;margin-top:16px}.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}
.undo{display:block;margin:10px auto 0;background:none;border:0;color:var(--acc);font:inherit;font-size:13px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .25s}.undo.on{opacity:1;pointer-events:auto}
.dw{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px}.dw .t{flex:1;min-width:0}.dw b{font-size:15.5px}.dw span{color:var(--muted);font-size:13.5px}.dw i{display:block;font-style:italic;color:var(--muted);font-size:12.5px;margin-top:2px}.dw .lbl{font-style:normal;font-size:11.5px;color:var(--acc);display:block;margin-top:3px}
.pill{font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--ok);white-space:nowrap}.pill.w{color:var(--warn)}
.add input,.add textarea{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);font:inherit;font-size:15px;padding:11px 14px;border-radius:14px;margin-bottom:8px;outline:0}.add small{display:block;color:var(--muted);font-size:12px;margin:-2px 0 8px}
.pr{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}.pr:last-child{border:0}.pr span:first-child{color:var(--muted)}.pr span:last-child{text-align:right}
.req b{font-size:16px}.req code{display:block;background:var(--bg);border-radius:12px;padding:11px 12px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;margin:8px 0 12px;white-space:pre-wrap;word-break:break-word}
.ph2{display:flex;align-items:center;gap:14px;margin-bottom:14px}.av{width:62px;height:62px;flex:none;border-radius:50%;background:var(--acc);color:var(--accd);display:grid;place-items:center;font-size:26px;font-weight:700}.ph2 b{font-size:20px;display:block}.ph2 span{color:var(--muted);font-size:13px}
.sec2{font-size:12.5px;color:var(--muted);margin:20px 2px 8px;text-transform:uppercase;letter-spacing:.06em}
textarea.goal{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);font:inherit;font-size:15px;line-height:1.45;padding:12px 14px;border-radius:16px;resize:none;outline:0;min-height:80px}
.lk{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:11px 14px;margin-bottom:8px}.lk a,.lk div{flex:1;min-width:0}.lk b{font-size:14.5px;display:block}.lk span{font-size:12.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lk button{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px}
.mon{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.mon:last-child{border:0}.mon span{color:var(--muted)}
.tb{position:absolute;left:0;right:0;bottom:0;height:calc(74px + env(safe-area-inset-bottom));background:var(--bg2);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(12px + env(safe-area-inset-bottom))}
.tb[hidden]{display:none}
.tb .pillbg{position:absolute;top:8px;left:6px;width:calc((100% - 12px)/5);height:34px;display:flex;justify-content:center;pointer-events:none;transition:transform .45s cubic-bezier(.34,1.4,.5,1)}.tb .pillbg i{width:54px;height:100%;background:var(--pillbg);border-radius:999px}
.ti{position:relative;z-index:1;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit;font-size:11px;padding-top:7px;cursor:pointer;transition:color .25s}.ti svg{font-size:21px}.ti.on{color:var(--acc)}.ti.on svg{animation:bump .4s cubic-bezier(.34,1.56,.64,1)}@keyframes bump{from{transform:scale(.7)}to{transform:none}}
.sheet-bg{position:absolute;inset:0;background:rgba(5,12,9,.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--sheet);border-radius:28px 28px 0 0;padding:10px 20px calc(28px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.9,.2,1);z-index:21}.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px}.sheet small{color:var(--muted);font-size:12.5px}.sheet h3{font-size:22px;margin:3px 0 4px}.sheet p{color:var(--muted);font-size:14px;margin-bottom:14px}
.blk{background:var(--card2);border-radius:16px;padding:12px 14px;margin-bottom:10px;font-size:14px;line-height:1.45;white-space:pre-wrap}.blk small{display:block;color:var(--muted);font-size:12px;margin-bottom:3px}
.toast{position:absolute;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--text);color:var(--bg);font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;opacity:0;transition:.3s;z-index:30;max-width:90%;text-align:center;pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0)}
.cf{position:absolute;width:9px;height:9px;border-radius:3px;pointer-events:none;z-index:40;animation:fall 1s ease-out forwards}
@keyframes fall{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
#state{position:absolute;inset:0;padding:calc(30px + env(safe-area-inset-top)) 18px;overflow:auto}
#state[hidden]{display:none}
.state{text-align:center;padding:90px 10px}.state-t{font-size:26px;font-weight:600}.state-s{color:var(--muted);margin-top:10px}
.sk{border-radius:22px;background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.3s infinite linear;margin-bottom:12px}@keyframes sh{to{background-position:-200% 0}}
</style>
</head>

var Q=[],TOTAL=0,flip=false,wmode="learn",dictLes=null,dictSt="all",pending=null,busy=false;
function doneToday(w){return w.last_correct_on===todayUTC()}
function dots(w){var n=Math.min(w.streak||0,3),s="";for(var i=0;i<3;i++)s+=i<n?"●":"○";return s}
function initQueue(){Q=(D.words||[]).filter(function(w){return !w.known&&!doneToday(w)}).slice(0,10);TOTAL=Q.length}
function remaining(){return Q.filter(function(w){return !w.known&&!doneToday(w)})}
function wordsHtml(){
  return '<h1 class="t">Слова</h1><div class="tabs" id="wtabs"><button data-w="learn" class="on">Вчу</button><button data-w="dict">Словник</button></div><div id="wlearn"></div><div id="wdict" hidden></div>';
}
function updateCounts(){
  var k=(D.words||[]).filter(function(w){return w.known}).length;
  if($("knownN"))$("knownN").textContent=k;
  var r=remaining().length;
  if($("todayN"))$("todayN").textContent=r?r+" "+plural(r,"слово чекає","слова чекають","слів чекають"):"усе вивчено 🎉";
}
function renderLearn(){
  var q=remaining(),all=D.words||[],box=$("wlearn");
  if(!q.length){
    box.innerHTML='<div class="card empty">'+(!all.length?"Слова з уроків з'являться тут. Марина додає їх після занять, а ти можеш додавати свої у «Словнику».":(all.every(function(w){return w.known})?"Усі слова вивчено 🎉":"На сьогодні все. Повертайся завтра 🎉"))+'</div>';updateCounts();return;
  }
  var w=q[0],h='<div class="bar"><i style="width:'+Math.round((TOTAL-q.length)/Math.max(TOTAL,1)*100)+'%"></i></div><div class="cnt">залишилось '+q.length+' · <span class="dots">'+dots(w)+'</span></div>';
  h+='<div class="stage"><div class="fc'+(flip?" flip":"")+' enter" id="fc"><div class="in"><div class="face"><div class="w">'+esc(w.en)+'</div><button class="sp" id="spk" aria-label="Вимова">'+IC.spk+'</button><div class="h">натисни, щоб побачити переклад</div></div>';
  h+='<div class="face back"><div class="tr">'+esc(w.uk)+'</div>'+(w.example?'<div class="ex">'+esc(w.example)+'</div><button class="sp" id="spk2" aria-label="Вимова прикладу">'+IC.spk+'</button>':'')+'</div></div></div></div>';
  h+='<div class="acts"><button class="btn" id="no">Ще не знаю</button><button class="btn pri" id="yes">Знаю ✓</button></div><div class="hint">Свайп вправо: знаю · вліво: ще не знаю</div><button class="undo'+(pending?" on":"")+'" id="undo">↶ Повернути попереднє слово</button>';
  box.innerHTML=h;bindCard(w);updateCounts();
}
function bindCard(w){
  var fc=$("fc"),x0=null,dx=0,moved=false;
  $("spk").onclick=function(e){e.stopPropagation();say(w.en)};
  if($("spk2"))$("spk2").onclick=function(e){e.stopPropagation();say(w.example)};
  fc.addEventListener("pointerdown",function(e){if(e.target.closest(".sp"))return;x0=e.clientX;dx=0;moved=false;try{fc.setPointerCapture(e.pointerId)}catch(x){}fc.classList.remove("enter")});
  fc.addEventListener("pointermove",function(e){if(x0===null)return;dx=e.clientX-x0;if(Math.abs(dx)>8)moved=true;if(moved){fc.style.transition="none";fc.style.transform="translateX("+dx+"px) rotate("+dx/18+"deg)"}});
  fc.addEventListener("pointerup",function(){if(x0===null)return;fc.style.transition="";if(Math.abs(dx)>90){answer(w,dx>0)}else{fc.style.transform="";if(!moved){flip=!flip;fc.classList.toggle("flip",flip)}}x0=null});
  fc.addEventListener("pointercancel",function(){x0=null;fc.style.transition="";fc.style.transform=""});
  $("yes").onclick=function(){answer(w,true)};$("no").onclick=function(){answer(w,false)};
  $("undo").onclick=undo;
}
function flush(keep){
  if(!pending)return;var p=pending;pending=null;clearTimeout(p.t);
  var u=$("undo");if(u)u.classList.remove("on");
  rpc("cabinet_word_answer",{p_code:CODE,p_word_id:p.w.id,p_correct:p.ok},keep).then(function(r){if(r){p.w.streak=r.streak;p.w.known=r.known;updateCounts()}}).catch(function(){toast("Не вдалося зберегти відповідь. Перевір інтернет.")});
}
function answer(w,ok){
  if(busy)return;var fc=$("fc");if(!fc)return;busy=true;fc.style.transform="";
  fc.classList.add(ok?"out-r":"out-l");
  if(ok)confetti(fc);
  setTimeout(function(){
    flush();
    var prev={streak:w.streak||0,known:!!w.known,last:w.last_correct_on,pos:Q.indexOf(w)};
    if(ok){if(w.last_correct_on!==todayUTC())w.streak=Math.min((w.streak||0)+1,3);w.known=w.streak>=3;w.last_correct_on=todayUTC()}
    else{w.streak=0;w.known=false;Q.splice(Q.indexOf(w),1);Q.push(w)}
    pending={w:w,ok:ok,prev:prev,t:setTimeout(function(){flush()},6000)};
    flip=false;busy=false;renderLearn();renderDict();
  },380);
}
function undo(){
  if(!pending)return;var p=pending;pending=null;clearTimeout(p.t);
  var w=p.w;w.streak=p.prev.streak;w.known=p.prev.known;w.last_correct_on=p.prev.last;
  var i=Q.indexOf(w);if(i>-1)Q.splice(i,1);Q.unshift(w);
  flip=false;renderLearn();renderDict();
}

window.addEventListener("pagehide",function(){flush(true)});
function confetti(el){
  var cols=["#D6CBF2","#F5F0E6","#9fd8b4","#b9a6f0"],r=el.getBoundingClientRect(),p=$("shell").getBoundingClientRect();
  for(var i=0;i<16;i++){var s=document.createElement("span");s.className="cf";s.style.left=(r.left-p.left+r.width/2)+"px";s.style.top=(r.top-p.top+r.height/2)+"px";s.style.background=cols[i%4];
    s.style.setProperty("--dx",(Math.random()*240-120)+"px");s.style.setProperty("--dy",(Math.random()*200-60)+"px");$("shell").appendChild(s);setTimeout(function(el2){return function(){el2.remove()}}(s),1000)}
}

var MM=null;
function suggest(from,to,lp){
  var a=$(from),b=$(to);if(!a||!b)return;
  a.oninput=function(){
    clearTimeout(MM);var q=a.value.trim();
    if(q.length<2||b.dataset.m==="1")return;
    MM=setTimeout(function(){
      fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(q)+"&langpair="+lp).then(function(r){return r.json()}).then(function(j){
        var t=j&&j.responseData&&j.responseData.translatedText;
        if(t&&a.value.trim()===q&&b.dataset.m!=="1"&&!/MYMEMORY|QUERY LENGTH|INVALID/i.test(t)&&t.toLowerCase()!==q.toLowerCase())b.value=t;

  };

}

  if(s.payment_details||s.payment_url){

    if(s.payment_details)h+='<code>'+esc(s.payment_details)+'</code>';
    h+='<div class="btns">'+(s.payment_details?'<button class="btn pri" id="copy">'+IC.copy+' Скопіювати реквізити</button>':'')+(s.payment_url?'<a class="btn'+(s.payment_details?'':' pri')+'" href="'+safeUrl(s.payment_url)+'" target="_blank" rel="noopener noreferrer">Оплатити за посиланням ↗</a>':'')+'</div></div>';
  }
  return h;
}
function bindPay(){
  if($("copy"))$("copy").onclick=function(){var t=(D.student||{}).payment_details||"";try{navigator.clipboard.writeText(t).then(function(){toast("Скопійовано")},function(){toast("Виділи й скопіюй вручну")})}catch(e){toast("Виділи й скопіюй вручну")}};
}

/* ----- профіль ----- */
var th="dark";try{th=localStorage.getItem("cab-theme")||"dark"}catch(e){}
function setTh(v){document.documentElement.setAttribute("data-theme",v);th=v;try{localStorage.setItem("cab-theme",v)}catch(e){}var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=v==="light"?"#E8EFEA":"#12261F"}
setTh(th);
function toggleTheme(){setTh(th==="dark"?"light":"dark")}
function profileHtml(){
  var s=D.student||{},ls=D.lessons||[],sm=D.summaries||[];
  var last=ls[0]?dayLabel(ls[0].starts_at):"—";
  var h='<div class="ph2"><div class="av">'+esc((s.name||"?").charAt(0).toUpperCase())+'</div><div><b>'+esc(s.name||"")+'</b><span>'+(s.level?"Рівень "+esc(s.level):"")+'</span></div></div>';
  h+='<div class="card"><div class="pr"><span>Початок занять</span><span>'+esc(s.start_date?fmt(s.start_date+"T12:00:00Z",{day:"numeric",month:"long",year:"numeric"}):"—")+'</span></div><div class="pr"><span>Останнє заняття</span><span>'+esc(last)+'</span></div></div>';
  h+='<div class="sec2">Моя мета</div><textarea class="goal" id="goal" maxlength="300" placeholder="Напиши, навіщо тобі англійська: Марина врахує це на заняттях">'+esc(s.goal||"")+'</textarea>';
  h+='<div class="sec2">Мої посилання й нотатки</div><div id="links"></div><div id="linkf" hidden><div class="add" style="margin-top:6px"><input id="lt" maxlength="100" placeholder="Назва або нотатка"><input id="lu" maxlength="400" placeholder="Посилання (необов\'язково)"><button class="btn pri" id="lsave" style="width:100%">Зберегти</button></div></div><button class="btn" id="ladd" style="width:100%;margin-top:4px">＋ Додати</button>';
  if(sm.length)h+='<div class="sec2">Підсумки місяців</div><div class="card">'+sm.map(function(m){return '<div class="mon"><b>'+esc(monthLabel(String(m.month).slice(0,7)))+'</b><br><span>'+esc(m.text)+'</span></div>'}).join("")+'</div>';
  h+='<div class="sec2">Інше</div><div class="btns"><button class="btn" id="thm2">Тема: темна / світла</button>'+(CONFIG.OFFER_URL?'<a class="btn" href="'+safeUrl(CONFIG.OFFER_URL)+'" target="_blank" rel="noopener noreferrer">Публічна оферта ↗</a>':'')+'</div>';
  return h;
}
function renderLinks(){
  var L=D.links||[];
  $("links").innerHTML=L.length?L.map(function(k){return '<div class="lk">'+(k.url?'<a href="'+safeUrl(k.url)+'" target="_blank" rel="noopener noreferrer"><b>'+esc(k.title)+'</b><span>'+esc(k.url)+'</span></a>':'<div><b>'+esc(k.title)+'</b></div>')+'<button data-d="'+esc(k.id)+'" aria-label="Видалити">✕</button></div>'}).join(""):'<div class="empty" style="padding:10px 0">Тут можна зберігати корисні посилання й свої нотатки</div>';
  Array.prototype.forEach.call($("links").querySelectorAll("[data-d]"),function(b){b.onclick=function(){
    var id=b.dataset.d;rpc("cabinet_delete_link",{p_code:CODE,p_id:id}).then(function(ok){if(ok){D.links=(D.links||[]).filter(function(k){return k.id!==id});renderLinks()}else toast("Не вдалося видалити")}).catch(function(){toast("Не вдалося видалити. Спробуй ще раз.")})}});
}
function bindProfile(){
  var gt=null;
  $("goal").oninput=function(){clearTimeout(gt);var v=this.value.trim();gt=setTimeout(function(){
    rpc("cabinet_set_goal",{p_code:CODE,p_goal:v}).then(function(ok){if(ok){D.student.goal=v;toast("Мету збережено")}else toast("Не вдалося зберегти")}).catch(function(){toast("Не вдалося зберегти. Спробуй ще раз.")})},900)};
  renderLinks();
  $("ladd").onclick=function(){$("linkf").hidden=!$("linkf").hidden;if(!$("linkf").hidden)$("lt").focus()};
  $("lsave").onclick=function(){
    var t=$("lt").value.trim(),u=$("lu").value.trim();if(!t){toast("Додай назву або нотатку");return}
    var b=$("lsave");b.disabled=true;
    rpc("cabinet_add_link",{p_code:CODE,p_title:t,p_url:u}).then(function(r){b.disabled=false;
      if(r&&r.id){D.links=[r].concat(D.links||[]);$("lt").value="";$("lu").value="";$("linkf").hidden=true;renderLinks();toast("Збережено ✓")}else toast("Не вдалося зберегти")}).catch(function(){b.disabled=false;toast("Не вдалося зберегти. Спробуй ще раз.")});
  };
  $("thm2").onclick=toggleTheme;
}

/* ----- збірка ----- */
function render(){
  var P=[homeHtml(),lessonsHtml(),wordsHtml(),payHtml(),profileHtml()];
  $("panels").innerHTML=P.map(function(x,i){return '<section class="panel after" data-i="'+i+'" id="p-'+TABS[i]+'">'+x+'</section>'}).join("");
  $("state").hidden=true;$("panels").hidden=false;$("nav").hidden=false;
  Array.prototype.forEach.call(document.querySelectorAll("[data-go]"),function(b){b.onclick=function(){go(+b.dataset.go)}});
  Array.prototype.forEach.call(document.querySelectorAll("[data-sheet]"),function(b){b.onclick=function(){openSheet(b.dataset.sheet)}});
  $("thm").onclick=toggleTheme;
  bindLessons();bindWords();bindPay();bindProfile();updateCounts();
  var hsh=(location.hash||"").replace("#",""),i=TABS.indexOf(hsh);go(i>-1?i:0,true);
}

/* ----- заставка ----- */
(function(){var sp=$("splash");if(!sp)return;function h(){sp.classList.add("hide");setTimeout(function(){sp.remove()},600)}
var d=new Date().toISOString().slice(0,10),seen=false;try{seen=localStorage.getItem("cab-splash")===d}catch(e){}
if(seen&&location.hash!=="#splash"){sp.remove();return}
try{localStorage.setItem("cab-splash",d)}catch(e){}
sp.onclick=h;setTimeout(h,2600)})();

/* ----- демо-режим (?code=demo): тестові дані без бази ----- */
var DEMO_DATA=null;
function demoRpc(name,a){
  return new Promise(function(res){setTimeout(function(){
    if(name==="cabinet_get")return res(DEMO_DATA);
    if(name==="cabinet_set_goal")return res(true);
    if(name==="cabinet_word_answer"){var w=DEMO_DATA.words.filter(function(x){return x.id===a.p_word_id})[0];var st=a.p_correct?Math.min((w.streak||0)+1,3):0;return res({streak:st,known:st>=3})}
    if(name==="cabinet_add_word")return res({id:"n"+Date.now(),en:a.p_en,uk:a.p_uk,example:a.p_example||null});
    if(name==="cabinet_add_link")return res({id:"k"+Date.now(),title:a.p_title,url:a.p_url||null});
    if(name==="cabinet_delete_link")return res(true);
    res(null)},200)});
}
function buildDemo(){
  var now=Date.now(),day=86400000;function iso(d){return new Date(now+d*day).toISOString()}
  var it=function(){return [{role:"material",title:"Конспект (PDF)",url:"https://drive.google.com/"},{role:"material",title:"Інтерактивний урок",url:"https://example.com/"}]};
  DEMO_DATA={student:{name:"Анна",level:"A2+",goal:null,start_date:"2026-11-03",timezone:"Europe/Warsaw",zoom_url:"https://zoom.us/",chat_url:"https://t.me/",materials_url:null,payment_url:"https://example.com/pay",payment_details:"ФОП Прізвище І. П.\nIBAN: UA00 0000 0000 0000 0000 0000 00000"},
   balance:{bought:8,used:6,left:2},next_lesson:{starts_at:iso(2),duration_min:50},
   lessons:[
    {id:"l3",starts_at:iso(-3),topic:"On the way",grammar:"Directions · asking the way",tags:["Speaking","Travel"],comment:"Дуже гарно впоралась з маршрутами.",homework_text:"Розділ 4 інтерактивного уроку",homework_sent:true,homework_checked:false,items:it()},
    {id:"l2",starts_at:iso(-5),topic:"Can you help me?",grammar:"Could you…? (requests)",tags:["Grammar","Speaking"],comment:null,homework_text:null,homework_sent:false,homework_checked:true,items:it()},
    {id:"l1",starts_at:iso(-12),topic:"Plans and decisions",grammar:"going to vs will",tags:["Grammar"],comment:null,homework_text:null,homework_sent:false,homework_checked:true,items:it()},
    {id:"l0",starts_at:iso(-30),topic:"Знайомство",grammar:null,tags:[],comment:"Визначили мету й план.",homework_text:null,homework_sent:false,homework_checked:false,items:[]}],
   packages:[{purchased_at:"2026-11-03",lessons_count:8,total_price:4100,paid_at:"2026-11-03"}],
   summaries:[{month:"2026-11-01",text:"Перший місяць: розмовна база, плани й рішення, лексика подорожей."}],
   links:[{id:"k0",title:"BBC Learning English",url:"https://www.bbc.co.uk/learningenglish"}],
   words:[["boarding pass","посадковий талон","Please show your boarding pass.","l3"],["luggage","багаж","My luggage is heavy.","l3"],["delay","затримка","There is a delay.","l3"],["gate","вихід на посадку","Go to gate 12.","l3"],["to check in","зареєструватися","I need to check in online.","l2"],["favor","послуга","Could you do me a favor?","l2"]].map(function(x,i){return {id:"w"+i,en:x[0],uk:x[1],example:x[2],lesson_id:x[3],streak:i===5?3:0,known:i===5,last_correct_on:null}})};
}

/* ----- запуск ----- */
(function(){
  var m=location.search.match(/[?&]code=([^&]+)/);
  CODE=m?decodeURIComponent(m[1]).trim():"";
  if(!CODE){showState("Відкрий кабінет за своїм посиланням","Це посилання тобі надсилає Марина. Якщо ти його загубила, напиши їй.");return}
  if(CODE==="demo"){DEMO=true;buildDemo()}
  else if(CONFIG.ANON_KEY.indexOf("ВСТАВ")===0){showState("Кабінет ще налаштовується","Не вказано ключ доступу до бази.");return}
  rpc("cabinet_get",{p_code:CODE}).then(function(r){
    if(!r){showState("Посилання не працює","Воно може бути неповним або кабінет ще не відкрито. Напиши Марині, вона допоможе.");return}
    D=r;render();
  }).catch(function(){showState("Не вдалося завантажити","Перевір інтернет і онови сторінку. Якщо не допомагає, напиши Марині.")});
})();
